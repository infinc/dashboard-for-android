org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# connectedDebugAndroidTest（Compose の UI テスト）は、既定では終わったあとにアプリをアンインストールし、
# 端末の設定（config.json・トークン・背景画像）まで消してしまう。壁に掛けた実機で走らせても消えないよう、入れたままにする。
android.injected.androidTest.leaveApksInstalledAfterRun=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
