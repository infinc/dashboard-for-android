<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walldash</title>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="layout-balanced">
<div id="shift">
  <main>
    <section class="card c-clock s4" id="cardClock">
      <div class="card-head"><div class="card-title">時刻</div><div class="card-note num" id="clockTz"></div></div>
      <div class="card-body">
        <div class="clock-time num" id="clockTime">--:--</div>
        <div class="clock-date" id="clockDate"></div>
        <div class="clock-sub" id="clockSub"></div>
      </div>
    </section>

    <section class="card c-weather s4" id="cardWeather">
      <div class="card-head"><div class="card-title">天気</div><div class="card-note" id="wxNote"></div></div>
      <div class="card-body" id="wxBody"></div>
    </section>

    <section class="card c-disaster s4" id="cardDisaster">
      <div class="card-head"><div class="card-title">防災</div><div class="card-note" id="disasterNote"></div></div>
      <div class="card-body dis-split">
        <div id="disasterBody"></div>
        <!-- 強震モニタ（防災科研）。透過の観測画像を地図の上に重ねる。
             画像は 3 秒ごとに JS が差し替える。 -->
        <div class="kmoni">
          <div class="kmoni-base"></div>
          <div class="kmoni-live" id="kmoniLive"></div>
          <div class="kmoni-foot"><span id="kmoniTime" class="num"></span></div>
        </div>
      </div>
    </section>

    <section class="card c-memo s5" id="cardMemo">
      <div class="card-head"><div class="card-title">LINE メモ</div><div class="card-note" id="memoNote"></div></div>
      <div class="card-body scroll" id="memoBody"></div>
    </section>

    <section class="card c-hourly" id="cardHourly">
      <div class="card-head"><div class="card-title">時間別予報（12 時間）</div>
        <!-- 中身は dashboard.js が設定（気温だけ／降水確率だけ／両方）に合わせて書き換える -->
        <div class="legend" id="hourlyLegend"><i class="sw sw-line"></i><span>気温</span><i class="sep">/</i><i class="sw sw-bar"></i><span>降水確率</span></div>
      </div>
      <div class="card-body" id="hourlyBody"></div>
    </section>

    <!-- 時間別予報を狭めて空いた右側。Spotify で再生中の曲を出す。 -->
    <section class="card c-spotify" id="cardSpotify">
      <div class="card-head"><div class="card-title">Spotify</div><div class="card-note" id="spotifyNote"></div></div>
      <div class="card-body" id="spotifyBody"></div>
    </section>

    <section class="card c-wifi s3" id="cardWifi">
      <div class="card-head"><div class="card-title">Wi-Fi リンク速度</div><div class="card-note num" id="wifiNote"></div></div>
      <div class="card-body wifi-split" id="wifiBody">
        <div class="wifi-col">
          <div id="wifiMain"></div>
          <div id="wifiRows"></div>
          <div id="wifiSpark"></div>
        </div>
          <!-- 回る地球。Natural Earth の海岸線(110m)を正距円筒図法で帯にしたもの。
               帯の幅 76 = 経度 360 度で、見える面は半球ぶん（直径 38）。
               同じ帯を defs に 1 つだけ持ち、<use> で 3 枚並べて左へ流す。
               1 枚ぶん進むと元の絵に戻るので、継ぎ目なく回り続ける。 -->
