<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walldash — ログイン</title>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/settings.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 20px; }
  .box { width: 400px; max-width: 90vw; display: grid; grid-gap: 14px; gap: 14px; }
  h1 { font-size: 18px; }
  p { font-size: 13px; line-height: 1.7; }
  .err { color: var(--red); }
  .muted { color: var(--text-2); }
</style>
</head>
<body>
<form class="card box" id="form">
  <h1>設定画面へのログイン</h1>
  <p class="muted">この端末は LAN 公開が有効です。設定を変更するには PIN が必要です。</p>
  <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="PIN" required>
  <button type="submit">ログイン</button>
  <p id="msg" class="err"></p>
  <p class="muted">USB 接続（adb forward 経由の localhost）からは PIN なしで設定できます。</p>
</form>
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin: document.getElementById("pin").value }),
    });
    const data = await res.json();
    if (res.ok && data.ok) { location.href = "/settings"; return; }
    msg.textContent = data.message || "ログインできませんでした";
    if (data.remaining != null) msg.textContent += `（残り ${data.remaining} 回）`;
    if (data.retryAfterSeconds != null) {
      msg.textContent += `（${Math.ceil(data.retryAfterSeconds / 60)} 分後に再試行）`;
    }
  } catch (err) {
    msg.textContent = String(err);
  }
});
</script>
</body>
</html>
